name: Refresh profile contributions
on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh activity card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            python3 .github/scripts/refresh_contributions.py --with-private
          else
            python3 .github/scripts/refresh_contributions.py
          fi
      - name: Publish updated count
        run: |
          if ! git diff --quiet -- profile/activity.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add profile/activity.svg
            git commit -m 'Refresh profile activity card'
            git push
          fi
